<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Glowing accents -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Blueprint Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.22" />
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#gridPattern)" />

  <!-- Animated dynamic background orbs using native SMIL -->
  <!-- Left Orb -->
  <circle cx="180" cy="110" r="160" fill="url(#indigoOrb)">
    <animate attributeName="cx" values="180;230;180" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="110;80;110" dur="8s" repeatCount="indefinite" />
    <animate attributeName="r" values="160;185;160" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Right Orb -->
  <circle cx="1020" cy="240" r="170" fill="url(#cyanOrb)">
    <animate attributeName="cx" values="1020;970;1020" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="240;270;240" dur="10s" repeatCount="indefinite" />
    <animate attributeName="r" values="170;195;170" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Top Right Purple Orb -->
  <circle cx="940" cy="80" r="130" fill="url(#purpleOrb)">
    <animate attributeName="cx" values="940;980;940" dur="9s" repeatCount="indefinite" />
    <animate attributeName="cy" values="80;60;80" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic flowing feedback loops in background -->
  <path d="M -50 80 Q 300 20 600 80 T 1250 80" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="16, 12">
    <animate attributeName="stroke-dashoffset" from="0" to="280" dur="12s" repeatCount="indefinite" />
  </path>
  <path d="M -50 280 Q 400 340 750 280 T 1250 300" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="14, 10">
    <animate attributeName="stroke-dashoffset" from="240" to="0" dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Background decorative badges -->
  <g transform="translate(60, 240)">
    <rect width="140" height="32" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="70" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
      PPO &amp; GRPO
    </text>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
  </g>

  <g transform="translate(1000, 70)">
    <rect width="140" height="32" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="70" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#c084fc">
      DPO &amp; KTO
    </text>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite" />
  </g>

  <!-- Centered Foreground Content (High Contrast, Crisp, Immune to occlusion) -->
  <g transform="translate(600, 100)">
    <!-- Top Pill Badge -->
    <rect x="-190" y="-30" width="380" height="34" rx="17" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      CURATED ECOSYSTEM &amp; FRAMEWORKS
    </text>

    <!-- Main Title -->
    <text x="0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" fill="#ffffff">
      Awesome LLM Reinforcement Learning &amp; RLHF
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      The Ultimate Directory for Human Feedback, Preference Optimization &amp; Self-Hosted Alignment
    </text>

    <!-- Key Tech Pillars -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">
        <tspan fill="#38bdf8">&#x25CF; RLHF</tspan>
        <tspan fill="#64748b">&#160;&#160;&#160;|&#160;&#160;&#160;</tspan>
        <tspan fill="#818cf8">&#x25CF; DPO / KTO / GRPO</tspan>
        <tspan fill="#64748b">&#160;&#160;&#160;|&#160;&#160;&#160;</tspan>
        <tspan fill="#c084fc">&#x25CF; Reward Modeling</tspan>
        <tspan fill="#64748b">&#160;&#160;&#160;|&#160;&#160;&#160;</tspan>
        <tspan fill="#34d399">&#x25CF; Reasoning Synthesis</tspan>
        <tspan fill="#64748b">&#160;&#160;&#160;|&#160;&#160;&#160;</tspan>
        <tspan fill="#f472b6">&#x25CF; Evals &amp; Alignment</tspan>
      </text>
    </g>
  </g>
</svg>
