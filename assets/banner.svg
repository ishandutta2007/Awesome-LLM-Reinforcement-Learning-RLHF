<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing card/pill gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <!-- Filters for glows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Background subtle animations */
    @keyframes orbFloat1 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
      50% { transform: translate(40px, -25px) scale(1.15); opacity: 0.6; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
    }
    @keyframes orbFloat2 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(-35px, 30px) scale(1.2); opacity: 0.55; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseCard {
      0% { opacity: 0.25; }
      50% { opacity: 0.45; }
      100% { opacity: 0.25; }
    }

    .orb1 { animation: orbFloat1 9s ease-in-out infinite; }
    .orb2 { animation: orbFloat2 11s ease-in-out infinite; }
    .flow-path {
      stroke-dasharray: 20 10;
      animation: flowLine 14s linear infinite;
    }
    .pulse-item {
      animation: pulseCard 4s ease-in-out infinite;
    }
  </style>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic / Animated Background Orbs (Kept behind foreground text) -->
  <g class="orb1">
    <circle cx="200" cy="100" r="140" fill="#6366f1" filter="url(#glowFilter)" />
  </g>
  <g class="orb2">
    <circle cx="1020" cy="240" r="150" fill="#06b6d4" filter="url(#glowFilter)" />
  </g>
  <g class="orb1" style="animation-delay: -3s;">
    <circle cx="950" cy="80" r="100" fill="#a855f7" filter="url(#glowFilter)" opacity="0.3" />
  </g>

  <!-- Flow lines in background representing RL loop / feedback -->
  <path class="flow-path" d="M -50 80 Q 300 20 600 80 T 1250 80" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.35" />
  <path class="flow-path" d="M -50 290 Q 400 340 750 280 T 1250 300" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" style="animation-delay: -5s;" />

  <!-- Decorative subtle background tech cards / pills -->
  <g class="pulse-item" transform="translate(80, 240)">
    <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="65" y="22" text-anchor="middle" class="pill-text" fill="#38bdf8">⚡ PPO / GRPO</text>
  </g>
  <g class="pulse-item" transform="translate(980, 70)" style="animation-delay: -2s;">
    <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="70" y="22" text-anchor="middle" class="pill-text" fill="#c084fc">🧠 Direct Pref Opt</text>
  </g>

  <!-- Centered Foreground Content Container (High Contrast, Guaranteed Readability) -->
  <g transform="translate(600, 100)">
    <!-- Top Pill Badge -->
    <rect x="-190" y="-30" width="380" height="34" rx="17" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="1.5" />
    <text x="0" y="-8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      CURATED ECOSYSTEM &amp; FRAMEWORKS
    </text>

    <!-- Main Title -->
    <text x="0" y="60" text-anchor="middle" class="title-text">
      Awesome LLM Reinforcement Learning &amp; RLHF
    </text>

    <!-- Subtitle -->
    <text x="0" y="105" text-anchor="middle" class="subtitle-text">
      The Ultimate Directory for Human Feedback, Preference Optimization &amp; Self-Hosted Alignment
    </text>

    <!-- Tech tags -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" word-spacing="4px">
        <tspan fill="#38bdf8">● RLHF</tspan> &nbsp;&nbsp;&nbsp;
        <tspan fill="#818cf8">● DPO / KTO / GRPO</tspan> &nbsp;&nbsp;&nbsp;
        <tspan fill="#c084fc">● Reward Modeling</tspan> &nbsp;&nbsp;&nbsp;
        <tspan fill="#34d399">● Reasoning Synthesis</tspan> &nbsp;&nbsp;&nbsp;
        <tspan fill="#f472b6">● Evals &amp; Alignment</tspan>
      </text>
    </g>
  </g>
</svg>
